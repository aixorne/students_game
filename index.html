<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Summary of the Plan.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="bootstrap.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<style>

body{
font-family:'Prompt',sans-serif;
background:#f5f7fb;
}

textarea{
resize:none;
}

.card-box{
background:#fff;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
padding:20px;
margin-top:20px;
}

</style>

</head>

<body>

<div style="background:#006699;">
<div class="text-center text-white p-2">
<h1>สรุปยอดแผนประจำวัน</h1>
</div>
</div>

<div class="container">

<div class="card-box">

<div style="background:#0066FF;border-radius:10px;">

<div class="row pt-2 ps-2 pe-2 text-white">

<div class="col-3 border border-info-subtle d-flex justify-content-center align-items-center border-end-0">
<h3 class="m-2">สินค้า</h3>
</div>

<div class="col-3 border border-info-subtle d-flex justify-content-center align-items-center border-end-0">
<h3 class="m-2">Lot</h3>
</div>

<div class="col-3 border border-info-subtle d-flex justify-content-center align-items-center border-end-0">
<h3 class="m-2">Batch</h3>
</div>

<div class="col-3 border border-info-subtle d-flex justify-content-center align-items-center">
<h3 class="m-2">รับเข้า</h3>
</div>

</div>

<div class="row pb-2 ps-2 pe-2">

<div class="col-3 p-3 border border-info-subtle border-end-0 border-top-0">

<select class="form-select" id="product">

<option value="">📦 เลือกสินค้า</option>

<option>เต้าส่วน</option>
<option>กล้วยชิ้น</option>
<option>กล้วยลูก</option>
<option>ขนมตาล</option>
<option>ถั่วแปบ</option>
<option>โมจิโอวัลติน</option>
<option>พุดดิ้งโอวัลติน</option>
<option>ตะโก้เผือก</option>
<option>มันทิพย์</option>
<option>เผือกทิพย์</option>
<option>ข้าวเหนียวลำไย</option>
<option>โมจิใส</option>
<option>ชานมโมจิ</option>
<option>ไข่มุกทรงเครื่อง</option>

</select>

</div>

<div class="col-3 p-3 border border-info-subtle border-end-0 border-top-0">

<input
type="date"
class="form-control"
id="lotDate">

</div>

<div class="col-3 p-3 border border-info-subtle border-end-0 border-top-0">

<input
type="text"
class="form-control"
id="batch"
placeholder="กรอกข้อมูล">

</div>

<div class="col-3 p-3 border border-info-subtle border-top-0">

<input
type="number"
class="form-control"
id="qty"
placeholder="กรอกข้อมูล">

</div>

</div>
</div>

<div class="mt-4 d-flex flex-wrap gap-2">

<button class="btn btn-success" onclick="saveData()">
💾 Save
</button>

<button class="btn btn-warning" onclick="clearForm()">
🧹 Clear Form
</button>

<button class="btn btn-primary" onclick="copyText()">
📋 Copy
</button>

<button class="btn btn-danger" onclick="clearTextArea()">
🗑 ลบข้อความ
</button>

</div>

<div class="mt-3">

<label class="form-label fw-bold">
ผลลัพธ์
</label>

<textarea
id="result"
class="form-control"
rows="14"
readonly
placeholder="กด Save เพื่อบันทึกข้อมูล..."></textarea>

</div>

</div>

</div>

<script>

const STORAGE_KEY = "summary_plan_data";

window.onload = function(){

const data = localStorage.getItem(STORAGE_KEY);

if(data){
document.getElementById("result").value = data;
}

};
function saveData(){

const product = document.getElementById("product");
const lotDate = document.getElementById("lotDate").value;
const batch = document.getElementById("batch").value.trim();
const qty = document.getElementById("qty").value;
const result = document.getElementById("result");

if(product.value==""){
alert("กรุณาเลือกสินค้า");
return;
}

if(lotDate=="" || batch=="" || qty==""){
alert("กรุณากรอกข้อมูลให้ครบ");
return;
}

// แสดงเฉพาะ "วัน"
const day = lotDate.split("-")[2];

// ใส่ comma
const number = Number(qty).toLocaleString("en-US");

const text =
${product.options[product.selectedIndex].text}
${day}/${batch}=${number};

if(result.value!=""){
result.value += "\n\n";
}

result.value += text;

// บันทึก LocalStorage
localStorage.setItem(STORAGE_KEY,result.value);

// ล้างฟอร์ม
clearForm();

}

function clearForm(){

document.getElementById("product").selectedIndex = 0;
document.getElementById("lotDate").value = "";
document.getElementById("batch").value = "";
document.getElementById("qty").value = "";

}
function copyText(){

const result = document.getElementById("result");

if(result.value==""){
alert("ไม่มีข้อมูลสำหรับคัดลอก");
return;
}

navigator.clipboard.writeText(result.value)
.then(()=>{
alert("คัดลอกข้อความเรียบร้อย");
})
.catch(()=>{
result.select();
document.execCommand("copy");
alert("คัดลอกข้อความเรียบร้อย");
});

}

function clearTextArea(){

if(confirm("ต้องการลบข้อความทั้งหมดใช่หรือไม่?")){

document.getElementById("result").value = "";

localStorage.removeItem(STORAGE_KEY);

}

}

</script>

</body>
</html>
