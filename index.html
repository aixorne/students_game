<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summary of the Plan</title> 

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"> 

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Flatpickr (Custom Datepicker สวยๆ) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>

<style> 
:root {
  --primary-gradient: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%);
  --accent-color: #4364F7;
}

body {
  font-family: 'Prompt', sans-serif;
  background: #f0f4f9;
  color: #333;
} 

.app-header {
  background: var(--primary-gradient);
  box-shadow: 0 4px 15px rgba(0, 102, 255, 0.2);
}

.card-box {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  padding: 24px;
  margin-top: 20px;
  border: 1px solid rgba(255, 255, 255, 0.8);
} 

.table-header-custom {
  background: var(--primary-gradient);
  border-radius: 16px;
  padding: 15px;
}

/* Custom Input Styles */
.form-control, .custom-select-btn {
  border-radius: 12px;
  border: 1.5px solid #dce4ec;
  padding: 12px 16px;
  font-size: 0.95rem;
  transition: all 0.25s ease-in-out;
  background-color: #ffffff;
  color: #333;
  width: 100%;
  text-align: left;
}

.form-control:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 4px rgba(67, 100, 247, 0.15);
}

.custom-select-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Flatpickr Custom Design */
.flatpickr-calendar {
  border-radius: 16px !important;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15) !important;
  border: none !important;
  font-family: 'Prompt', sans-serif !important;
}

.flatpickr-day.selected {
  background: var(--accent-color) !important;
  border-color: var(--accent-color) !important;
}

/* Modal Selector Design */
.product-list-group .list-group-item {
  border-radius: 12px !important;
  margin-bottom: 8px;
  border: 1.5px solid #edf2f7;
  padding: 12px 16px;
  font-weight: 500;
  transition: all 0.2s ease;
  cursor: pointer;
}

.product-list-group .list-group-item:hover,
.product-list-group .list-group-item.active {
  background-color: #eef2ff;
  color: var(--accent-color);
  border-color: var(--accent-color);
}

textarea.form-control {
  resize: none;
  background-color: #f8fafc;
  font-family: monospace, 'Prompt';
  font-size: 1rem;
  line-height: 1.6;
}

/* Buttons Styling */
.btn {
  border-radius: 12px;
  padding: 10px 20px;
  font-weight: 500;
  transition: all 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 12px rgba(0,0,0,0.12);
}

.btn-success { background-color: #2ec4b6; border: none; }
.btn-success:hover { background-color: #28b0a3; }

.btn-warning { background-color: #ff9f1c; border: none; color: #fff; }
.btn-warning:hover { background-color: #e88e13; color: #fff; }

.btn-primary { background-color: var(--accent-color); border: none; }
.btn-primary:hover { background-color: #3151d8; }

.btn-danger { background-color: #e63946; border: none; }
.btn-danger:hover { background-color: #d62837; }
</style> 

</head> 

<body> 

<div class="app-header">
  <div class="text-center text-white p-3">
    <h3 class="mb-0 fw-bold">📊 สรุปยอดแผนประจำวัน</h3>
  </div>
</div> 

<div class="container mb-5"> 
  <div class="card-box"> 

    <div class="table-header-custom shadow-sm"> 
      <div class="row g-3"> 

        <!-- ปุ่มเลือกสินค้า (เปิด Modal สวยๆ) -->
        <div class="col-md-3 col-12">
          <label class="form-label text-white fw-bold d-md-block d-none">สินค้า</label>
          <button class="custom-select-btn" type="button" data-bs-toggle="modal" data-bs-target="#productModal">
            <span id="selectedProductText">📦 เลือกสินค้า...</span>
            <small>▼</small>
          </button>
          <input type="hidden" id="productVal" value="">
        </div> 

        <!-- ตัวเลือกวันที่ (Flatpickr) -->
        <div class="col-md-3 col-12"> 
          <label class="form-label text-white fw-bold d-md-block d-none">Lot (วันที่)</label>
          <input type="text" class="form-control" id="lotDate" placeholder="📅 เลือกวันที่ Lot..."> 
        </div> 

        <!-- ช่องกรอก Batch -->
        <div class="col-md-3 col-12"> 
          <label class="form-label text-white fw-bold d-md-block d-none">Batch</label>
          <input type="text" class="form-control" id="batch" placeholder="🏷️ กรอก Batch"> 
        </div> 

        <!-- ช่องกรอกจำนวน -->
        <div class="col-md-3 col-12"> 
          <label class="form-label text-white fw-bold d-md-block d-none">รับเข้า</label>
          <input type="number" class="form-control" id="qty" placeholder="🔢 จำนวนรับเข้า"> 
        </div> 

      </div>
    </div> 

    <!-- ปุ่ม Save & Clear Form -->
    <div class="mt-4 d-flex flex-wrap gap-2"> 
      <button class="btn btn-success flex-grow-1 flex-md-grow-0" onclick="saveData()">💾 Save</button> 
      <button class="btn btn-warning flex-grow-1 flex-md-grow-0" onclick="clearForm()">🧹 Clear Form</button> 
    </div> 

    <!-- ผลลัพธ์ -->
    <div class="mt-4"> 
      <label class="form-label fw-bold fs-5 text-secondary">📋 ผลลัพธ์</label> 
      <textarea id="result" class="form-control" rows="8" readonly placeholder="กด Save เพื่อบันทึกข้อมูล..."></textarea> 
      
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary" onclick="copyText()">📋 Copy ข้อความ</button> 
        <button class="btn btn-danger" onclick="clearTextArea()">🗑 ลบข้อความทั้งหมด</button> 
      </div>
    </div> 

  </div> 
</div> 

<!-- Modal เลือกสินค้าแบบค้นหาและสวยงาม -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content" style="border-radius: 20px; border:none;">
      <div class="modal-header" style="background: var(--primary-gradient); color:white; border-radius: 20px 20px 0 0;">
        <h5 class="modal-title fw-bold">📦 เลือกรายการสินค้า</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3">
        <!-- Search Input -->
        <input type="text" class="form-control mb-3" id="searchProduct" placeholder="🔍 ค้นหาสินค้า..." onkeyup="filterProducts()">
        
        <!-- รายการสินค้า -->
        <div class="list-group product-list-group" id="productList">
          <div class="list-group-item" onclick="selectProduct('เต้าส่วน')">เต้าส่วน</div>
          <div class="list-group-item" onclick="selectProduct('กล้วยชิ้น')">กล้วยชิ้น</div>
          <div class="list-group-item" onclick="selectProduct('กล้วยลูก')">กล้วยลูก</div>
          <div class="list-group-item" onclick="selectProduct('ขนมตาล')">ขนมตาล</div>
          <div class="list-group-item" onclick="selectProduct('ถั่วแปบ')">ถั่วแปบ</div>
          <div class="list-group-item" onclick="selectProduct('โมจิโอวัลติน')">โมจิโอวัลติน</div>
          <div class="list-group-item" onclick="selectProduct('พุดดิ้งโอวัลติน')">พุดดิ้งโอวัลติน</div>
          <div class="list-group-item" onclick="selectProduct('ตะโก้เผือก')">ตะโก้เผือก</div>
          <div class="list-group-item" onclick="selectProduct('มันทิพย์')">มันทิพย์</div>
          <div class="list-group-item" onclick="selectProduct('เผือกทิพย์')">เผือกทิพย์</div>
          <div class="list-group-item" onclick="selectProduct('ข้าวเหนียวลำไย')">ข้าวเหนียวลำไย</div>
          <div class="list-group-item" onclick="selectProduct('โมจิใส')">โมจิใส</div>
          <div class="list-group-item" onclick="selectProduct('ชานมโมจิ')">ชานมโมจิ</div>
          <div class="list-group-item" onclick="selectProduct('ไข่มุกทรงเครื่อง')">ไข่มุกทรงเครื่อง</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script> 
const STORAGE_KEY = "summary_plan_data"; 
let productModalObj;

// เริ่มต้นเปิดหน้าเว็บ
window.onload = function(){ 
  const data = localStorage.getItem(STORAGE_KEY); 
  if(data){
    document.getElementById("result").value = data;
  } 

  // ติดตั้ง Flatpickr Date Picker (ภาษาไทย สไตล์ปฏิทินสว่าง)
  flatpickr("#lotDate", {
    locale: "th",
    dateFormat: "Y-m-d",
    altInput: true,
    altFormat: "j F Y",
    disableMobile: "true" // บังคับใช้ธีมสวยงามไม่ใช้ของระบบมือถือ
  });

  productModalObj = new bootstrap.Modal(document.getElementById('productModal'));
};

// เลือกสินค้าจาก Modal
function selectProduct(name) {
  document.getElementById("selectedProductText").innerText = "📦 " + name;
  document.getElementById("productVal").value = name;
  productModalObj.hide();
}

// ระบบค้นหาสินค้าใน Modal
function filterProducts() {
  const input = document.getElementById('searchProduct').value.toLowerCase();
  const items = document.querySelectorAll('#productList .list-group-item');
  items.forEach(item => {
    const text = item.innerText.toLowerCase();
    item.style.display = text.includes(input) ? '' : 'none';
  });
}

function saveData(){ 
  const productVal = document.getElementById("productVal").value;
  const lotDate = document.getElementById("lotDate").value;
  const batch = document.getElementById("batch").value.trim();
  const qty = document.getElementById("qty").value;
  const result = document.getElementById("result"); 

  if(productVal == ""){
    Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาเลือกสินค้า', confirmButtonColor: '#4364F7' });
    return;
  } 

  if(lotDate == "" || batch == "" || qty == ""){
    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: 'กรุณากรอก วันที่, Batch และ จำนวน ให้ครบถ้วน', confirmButtonColor: '#4364F7' });
    return;
  } 

  // ดึงเฉพาะ "วัน"
  const day = lotDate.split("-")[2]; 
  const number = Number(qty).toLocaleString("en-US"); 

  const text = `${productVal}\n${day}/${batch}=${number}`; 

  if(result.value != ""){
    result.value += "\n\n";
  } 

  result.value += text; 
  localStorage.setItem(STORAGE_KEY, result.value); 

  Swal.fire({
    icon: 'success',
    title: 'บันทึกสำเร็จ!',
    timer: 1300,
    showConfirmButton: false
  });

  clearForm(); 
} 

function clearForm(){ 
  document.getElementById("selectedProductText").innerText = "📦 เลือกสินค้า...";
  document.getElementById("productVal").value = "";
  document.getElementById("lotDate").value = "";
  if(document.getElementById("lotDate")._flatpickr) {
    document.getElementById("lotDate")._flatpickr.clear();
  }
  document.getElementById("batch").value = "";
  document.getElementById("qty").value = ""; 
}

function copyText(){ 
  const result = document.getElementById("result"); 
  if(result.value == ""){
    Swal.fire({ icon: 'info', title: 'ไม่พบข้อมูล', text: 'ไม่มีข้อมูลสำหรับคัดลอก', confirmButtonColor: '#4364F7' });
    return;
  } 

  navigator.clipboard.writeText(result.value)
  .then(()=>{
    Swal.fire({ icon: 'success', title: 'คัดลอกแล้ว!', timer: 1300, showConfirmButton: false });
  })
  .catch(()=>{
    result.select();
    document.execCommand("copy");
    Swal.fire({ icon: 'success', title: 'คัดลอกแล้ว!', timer: 1300, showConfirmButton: false });
  }); 
} 

function clearTextArea(){ 
  if(document.getElementById("result").value == ""){
    return;
  }

  Swal.fire({
    title: 'ยืนยันการลบ?',
    text: "ต้องการลบข้อความทั้งหมดใช่หรือไม่?",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#e63946',
    cancelButtonColor: '#6c757d',
    confirmButtonText: 'ใช่, ลบทั้งหมด!',
    cancelButtonText: 'ยกเลิก'
  }).then((resultAction) => {
    if (resultAction.isConfirmed) {
      document.getElementById("result").value = ""; 
      localStorage.removeItem(STORAGE_KEY); 
      Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย!', timer: 1200, showConfirmButton: false });
    }
  });
} 
</script> 

</body>
</html>
